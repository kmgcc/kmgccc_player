<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progressive Blur Lab</title>
<style>
  :root {
    --bg: #111214; --panel: #1b1c1f; --text: #e8e6e3; --muted: #8d8b88; --line: #2a2b2f; --accent: #e0b25c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  body { display: flex; overflow: hidden; }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; }
  #view { display: block; background: #000; }
  #hud { position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; justify-content: space-between;
    gap: 12px; pointer-events: none; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #panel { width: 316px; flex: none; background: var(--panel); overflow-y: auto; padding: 12px 14px 24px; }
  h2 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; letter-spacing: .04em; }
  h2:first-child { margin-top: 4px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin: 7px 0; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  .row .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row select { background: #26272b; color: var(--text); border: 0; border-radius: 6px; padding: 3px 6px; }
  .row input[type=checkbox] { accent-color: var(--accent); }
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  button { background: #2a2b30; color: var(--text); border: 0; border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #34363b; }
  #graph { width: 100%; height: 150px; display: block; background: #151619; border-radius: 6px; }
  #legend { color: var(--muted); margin-top: 4px; }
  #legend b { font-weight: 500; }
  #perf { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Narrow windows: canvas on top at full width, controls below in columns. */
  @media (max-width: 1199px) {
    body { flex-direction: column; overflow-y: auto; }
    #stage { flex: none; height: min(64vh, 62.5vw); }
    #panel { width: auto; flex: none; overflow: visible; column-width: 250px; column-gap: 28px; padding: 4px 16px 24px; }
    #panel h2, .row, .buttons, #graph, #legend { break-inside: avoid; }
  }
  textarea { width: 100%; height: 120px; background: #151619; color: var(--muted); border: 0; border-radius: 6px;
    font: 11px ui-monospace, Menlo, monospace; padding: 6px; display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hud"><span id="title"></span><span id="counter"></span></div>
</div>
<aside id="panel">
  <h2>半径曲线</h2>
  <canvas id="graph"></canvas>
  <div id="legend"><b style="color:var(--accent)">—</b> 模糊半径　<b style="color:#6f9fd8">—</b> 增长速度　<b style="color:#777">|</b> 起点 / 封面边缘</div>
  <div id="controls"></div>
  <h2>性能</h2>
  <div class="buttons"><button id="bench">测速</button><span id="perf"></span></div>
  <h2>参数</h2>
  <div class="buttons"><button id="export">导出参数</button><button id="reset">恢复默认</button></div>
  <textarea id="exportText" readonly></textarea>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>

name: macOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "refactor/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-verify:
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          # Select the newest versioned Xcode installed on the runner.
          # The project requires Xcode 26.2+; newer toolchains resolve
          # Swift 6 concurrency diagnostics (NonisolatedNonsendingByDefault)
          # that are false positives in earlier 26.x releases.
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then
            LATEST="/Applications/Xcode.app"
          fi
          echo "Selected: $LATEST"
          echo "DEVELOPER_DIR=${LATEST}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          python3.12 --version
          node --version
          corepack --version
          cmake --version | head -1

      - name: Quick verification
        run: KMGCCC_ARM_PYTHON="$(command -v python3.12)" ./scripts/verify.sh
